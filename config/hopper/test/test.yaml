env:
  name: hopper
  id: Hopper-v5
  action_type: continuous
  max_steps: 1000

expert:
  algo: sac
  save_path: models/hopper/expert
  random_seed: 42
  env_seed: 42
  total_timesteps: 1000000

  params:
    policy: MlpPolicy
    learning_rate: 0.001
    buffer_size: 1000000
    learning_starts: 10000
    batch_size: 256
    tau: 0.005
    gamma: 0.99
    train_freq: 1
    gradient_steps: 1
    seed: 42

trajectory_collection:
  output_dir: data/hopper
  random_seed: 42
  env_seed: 42

  train:
    n: 1000

  valid:
    n: 100

  test:
    n: 100

reward:
  hidden_dim: 64
  n_hidden_layers: 2
  clamp_magnitude: 10

policy:
  hidden_dim: 64
  n_hidden_layers: 2
  log_std_min: -20
  log_std_max: 2

fisher:
  random_seed: 42
  env_seed: 42
  
  n_outer_steps: 1000
  n_inner_steps: 10000

  n_agent_trajs: 1000

  alpha: 0.2
  gamma: 0.99

  fisher_reg: 1e-3
  fisher_sketch_size: 32
  fisher_batch_size: 256
  use_sketch: true

  lr_reward: 1e-6
  max_grad_norm: null
  scheduler_gamma: 1.0

  inner:
    type: sac

    train_env_seed: 100
    eval_env_seed: 101

    validate_every: 10000
    n_agent_eval_trajs: 10

    params:
      gradient_update_steps: 1
      target_update_interval: 1
      q_hidden_dim: 256
      q_n_hidden_layers: 2
      max_grad_norm: null
      critic_lr: 1e-4
      actor_lr: 1e-4
      batch_size: 256
      replay_buffer_capacity: 1000000
      tau: 0.005

ml_irl:
  random_seed: 42
  env_seed: 42

  n_outer_steps: 1000
  n_inner_steps: 1000

  n_agent_trajs: 100

  alpha: 0.2
  gamma: 0.99

  lr_reward: 1e-3
  max_grad_norm: 1.0

  inner:
    type: sac
    train_env_seed: 100
    eval_env_seed: 101

    validate_every: 1000
    n_agent_eval_trajs: 3

    params:
      gradient_update_steps: 1
      target_update_interval: 1
      q_hidden_dim: 256
      q_n_hidden_layers: 2
      max_grad_norm: null
      critic_lr: 1e-3
      actor_lr: 1e-3
      batch_size: 256
      replay_buffer_capacity: 1000000
      tau: 0.005

data:
  expert_train_trajs: data/hopper/expert_train_trajs.pt
  expert_valid_trajs: data/hopper/expert_valid_trajs.pt
  expert_test_trajs:  data/hopper/expert_test_trajs.pt
  random_train_trajs: data/hopper/random_train_trajs.pt
  random_valid_trajs: data/hopper/random_valid_trajs.pt
  random_test_trajs:  data/hopper/random_test_trajs.pt

policy_final_training:
    type: sac

    random_seed: 123
    train_env_seed: 123
    eval_env_seed: 124

    validate_every: 1000
    n_agent_eval_trajs: 10

    alpha: 0.1
    gamma: 0.99

    params:
      total_timesteps: 1000000
      gradient_update_steps: 1
      target_update_interval: 1
      q_hidden_dim: 256
      q_n_hidden_layers: 2
      max_grad_norm: null
      critic_lr: 1e-4
      actor_lr: 1e-4
      batch_size: 256
      replay_buffer_capacity: 1000000
      tau: 0.005

evaluation:
  random_seed: 42
  env_seed: 42
  n_agent_traj: 100

  bootstrap:
    enabled: true
    n_samples: 1000
    seed: 42
